name: Validate sacred texts

on:
  pull_request:
    paths:
      - "research/sacred-texts/**"
      - "collections/sacred-visions/**"
      - "scripts/validate-sacred-texts.mjs"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "research/sacred-texts/**"
      - "collections/sacred-visions/**"
      - "scripts/validate-sacred-texts.mjs"
      - "package.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run validate:sacred-texts

